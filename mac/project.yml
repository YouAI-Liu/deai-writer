name: DeAI
options:
  bundleIdPrefix: com.local.deai
targets:
  DeAI:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: DeAI
      - path: ../core/build/swift
    dependencies:
      - framework: ../core/build/DeAICore.xcframework
        embed: false
    configFiles:
      Debug: Config-Debug.xcconfig
      Release: Config-Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.deai
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        SWIFT_VERSION: "5.0"
        ENABLE_TESTABILITY: YES
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGNING_ALLOWED: YES
      configs:
        Debug:
          # Distinct bundle id + name so ad-hoc-signed DerivedData builds never
          # collide with the installed Release app in TCC's records.
          PRODUCT_BUNDLE_IDENTIFIER: com.local.deai.debug
          PRODUCT_NAME: "DeAI Debug"
          # keep the Swift module name stable — @testable import DeAI
          PRODUCT_MODULE_NAME: DeAI
  DeAITests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: DeAITests
    dependencies:
      - target: DeAI
    settings:
      base:
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/DeAI Debug.app/Contents/MacOS/DeAI Debug
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  DeAI:
    build:
      targets:
        DeAI: all
        DeAITests:
          - test
    test:
      targets:
        - DeAITests

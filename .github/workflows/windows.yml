name: Windows build and tests
on:
  push:
    paths: ['windows/**', 'core/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', 'core/**', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Rust tooling
        shell: pwsh
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $file = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe -OutFile $file
          if ((Get-AuthenticodeSignature $file).Status -ne 'Valid') { throw 'Invalid Inno Setup signature' }
          Start-Process $file -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-' -Wait
      - name: Build, unit tests and installer (UIA requires interactive desktop)
        shell: pwsh
        run: ./windows/scripts/build.ps1 -Test -Installer -SkipUia
      - name: Rust format and lint
        shell: pwsh
        run: |
          cargo fmt --manifest-path core/Cargo.toml -p deai-native -- --check
          cargo clippy --manifest-path core/Cargo.toml -p deai-native --release --all-targets -- -D warnings

[package]
name = "deai-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
deai-core = { path = "../deai-core" }
serde = { workspace = true }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
# harper-core transitively uses getrandom; on wasm32 it needs the JS backend.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
